<svg xmlns="http://www.w3.org/2000/svg" width="400" height="120" viewBox="0 0 400 120" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Kamunya Joska Building Materials</title>
  <desc>Clean modern logo with stacked stone icon and full business name</desc>

  <defs>
    <linearGradient id="stoneGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B04A2A"/>
      <stop offset="100%" stop-color="#8a3820"/>
    </linearGradient>
  </defs>

  <!-- Icon: geometric stone layers -->
  <g transform="translate(10, 20)">
    <!-- Top stone block -->
    <rect x="18" y="0" width="44" height="20" rx="2" fill="url(#stoneGrad)"/>
    <!-- Middle stone row: two blocks -->
    <rect x="6" y="24" width="30" height="20" rx="2" fill="#1B2A20"/>
    <rect x="40" y="24" width="30" height="20" rx="2" fill="#1B2A20"/>
    <!-- Bottom stone row: three blocks -->
    <rect x="0" y="48" width="24" height="20" rx="2" fill="#9BA79A"/>
    <rect x="28" y="48" width="24" height="20" rx="2" fill="#9BA79A"/>
    <rect x="56" y="48" width="24" height="20" rx="2" fill="#9BA79A"/>
  </g>

  <!-- Business name -->
  <text x="100" y="52" font-family="'Archivo Black', Arial Black, sans-serif" font-size="24" font-weight="900" fill="#1B2A20" letter-spacing="0.01em">KAMUNYA JOSKA</text>
  <text x="100" y="72" font-family="'JetBrains Mono', Courier New, monospace" font-size="12" fill="#9BA79A" letter-spacing="0.18em">BUILDING MATERIALS</text>

  <!-- Accent line -->
  <line x1="100" y1="82" x2="390" y2="82" stroke="#B04A2A" stroke-width="1.5"/>

</svg>
